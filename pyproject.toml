[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syncronizer"
version = "0.1.0"
description = "ETL sync agent: Firebird 2.5 -> SQLite control store -> HTTP API, as an always-on Windows service."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
    "firebirdsql>=1.2,<2",
    "passlib>=1.7,<2",          # required by firebirdsql for the auth handshake
    "APScheduler>=3.10,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "requests>=2.31,<3",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
syncronizer = "syncronizer.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
